<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard User</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons"
rel="stylesheet">

</head>

<body class="bg-slate-100">

<div class="flex">

    <!-- SIDEBAR -->
    <aside class="w-64 h-screen bg-blue-900 text-white fixed">

        <div class="p-6 border-b border-blue-700">
            <h1 class="text-2xl font-bold">
                Lost & Found
            </h1>
        </div>

        <nav class="mt-6">

            <a href="dashboard.html"
               class="flex items-center px-6 py-4 bg-blue-800">

                <span class="material-icons mr-3">
                    dashboard
                </span>

                Dashboard

            </a>

            <a href="add-report.html"
               class="flex items-center px-6 py-4 hover:bg-blue-800">

                <span class="material-icons mr-3">
                    add_circle
                </span>

                Buat Laporan

            </a>

            <a href="my-reports.html"
               class="flex items-center px-6 py-4 hover:bg-blue-800">

                <span class="material-icons mr-3">
                    description
                </span>

                Laporan Saya

            </a>

            <a href="profile.html"
               class="flex items-center px-6 py-4 hover:bg-blue-800">

                <span class="material-icons mr-3">
                    person
                </span>

                Profil

            </a>

        </nav>

    </aside>

    <!-- CONTENT -->
    <main class="ml-64 p-8 w-full">

        <!-- Header -->
        <div class="flex justify-between items-center mb-8">

            <div>

                <h2 class="text-4xl font-bold">
                    Dashboard
                </h2>

                <p class="text-gray-500">
                    Selamat datang kembali
                </p>

            </div>

            <button
                id="logoutBtn"
                class="bg-red-600 text-white px-5 py-2 rounded-lg hover:bg-red-700">

                Logout

            </button>

        </div>

        <!-- Statistik -->
        <div class="grid grid-cols-4 gap-6 mb-8">

            <div class="bg-white rounded-xl p-6 shadow">

                <h3 class="text-gray-500">
                    Total Laporan
                </h3>

                <p
                    id="totalReports"
                    class="text-4xl font-bold mt-2">

                    0

                </p>

            </div>

            <div class="bg-white rounded-xl p-6 shadow">

                <h3 class="text-gray-500">
                    Barang Hilang
                </h3>

                <p
                    id="lostReports"
                    class="text-4xl font-bold mt-2 text-red-600">

                    0

                </p>

            </div>

            <div class="bg-white rounded-xl p-6 shadow">

                <h3 class="text-gray-500">
                    Barang Ditemukan
                </h3>

                <p
                    id="foundReports"
                    class="text-4xl font-bold mt-2 text-green-600">

                    0

                </p>

            </div>

            <div class="bg-white rounded-xl p-6 shadow">

                <h3 class="text-gray-500">
                    Selesai
                </h3>

                <p
                    id="completedReports"
                    class="text-4xl font-bold mt-2 text-blue-600">

                    0

                </p>

            </div>

        </div>

        <!-- Tombol Buat Laporan -->
        <div class="mb-8">

            <a
                href="add-report.html"
                class="bg-blue-800 text-white px-6 py-3 rounded-lg inline-block hover:bg-blue-900">

                + Buat Laporan Baru

            </a>

        </div>

        <!-- Tabel Laporan -->
        <div class="bg-white rounded-xl shadow overflow-hidden">

            <div class="p-6 border-b">

                <h3 class="font-bold text-xl">
                    Semua Laporan
                </h3>

            </div>

            <table class="w-full">

                <thead class="bg-slate-100">

                    <tr>

                        <th class="p-4 text-left">
                            Nama Barang
                        </th>

                        <th class="p-4 text-left">
                            Tipe
                        </th>

                        <th class="p-4 text-left">
                            Status
                        </th>

                        <th class="p-4 text-left">
                            Lokasi
                        </th>

                        <th class="p-4 text-left">
                            Pemilik
                        </th>

                        <th class="p-4 text-left">
                            Aksi
                        </th>

                    </tr>

                </thead>

                <tbody id="reportTable">

                    <!-- Data otomatis dari dashboard.js -->

                </tbody>

            </table>

        </div>

    </main>

</div>

<script type="module" src="js/dashboard.js"></script>

</body>
</html>

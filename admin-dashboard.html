<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - pelaporan barang</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body class="bg-slate-100">

<div class="flex">

    <!-- SIDEBAR -->
    <aside class="w-64 h-screen bg-blue-900 text-white fixed flex flex-col">

        <div class="p-6 border-b border-blue-700">
            <h1 class="text-2xl font-bold">Admin Panel</h1>
            <p class="text-sm text-blue-200">Pelaporan Barang</p>
        </div>
        <nav class="mt-6 flex-1">

    <a
    href="admin-dashboard.html"
    class="flex items-center px-6 py-4 hover:bg-blue-800 bg-blue-800">

        <span class="material-icons mr-3">
            dashboard
        </span>

        Dashboard

    </a>

    <a
    href="admin-reports.html"
    class="flex items-center px-6 py-4 hover:bg-blue-800">

        <span class="material-icons mr-3">
            description
        </span>

        Semua Laporan

    </a>

    <a
    href="admin-users.html"
    class="flex items-center px-6 py-4 hover:bg-blue-800">

        <span class="material-icons mr-3">
            group
        </span>

        Manajemen User

    </a>

</nav>

        <button id="logoutBtn"
            class="m-6 bg-red-600 py-2 rounded-lg hover:bg-red-700">
            Logout
        </button>

    </aside>

    <!-- CONTENT -->
    <main class="ml-64 p-8 w-full">

        <!-- HEADER -->
        <div class="mb-8">
            <h2 class="text-3xl font-bold">Admin Dashboard</h2>
            <p class="text-gray-500">Kelola seluruh laporan sistem pelaporan barang</p>
        </div>

        <!-- STAT CARDS -->
        <div class="grid grid-cols-4 gap-6 mb-8">

            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="text-gray-500">Total Laporan</h3>
                <p id="totalReports" class="text-3xl font-bold">0</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="text-gray-500">Barang Hilang</h3>
                <p id="lostReports" class="text-3xl font-bold text-red-600">0</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="text-gray-500">Barang Ditemukan</h3>
                <p id="foundReports" class="text-3xl font-bold text-green-600">0</p>
            </div>

            <div class="bg-white p-6 rounded-xl shadow">
                <h3 class="text-gray-500">Selesai</h3>
                <p id="completedReports" class="text-3xl font-bold text-blue-600">0</p>
            </div>

        </div>

        <!-- TABLE -->
        <div class="bg-white rounded-xl shadow overflow-hidden">

            <div class="p-6 border-b">
                <h3 class="font-bold text-xl">Semua Laporan Masuk</h3>
            </div>

            <table class="w-full">

                <thead class="bg-slate-100">
                    <tr>
                        <th class="p-4 text-left">Barang</th>
                        <th class="p-4 text-left">Tipe</th>
                        <th class="p-4 text-left">User</th>
                        <th class="p-4 text-left">Lokasi</th>
                        <th class="p-4 text-left">Status</th>
                        <th class="p-4 text-left">Aksi</th>
                    </tr>
                </thead>

                <tbody id="reportTable"></tbody>

            </table>

        </div>

    </main>

</div>

<script type="module" src="js/admin-dashboard.js"></script>

</body>
</html>

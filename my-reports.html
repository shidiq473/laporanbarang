<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laporan Saya</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons"
rel="stylesheet">

</head>

<body class="bg-slate-100">

<div class="flex">

    <!-- SIDEBAR -->

    <aside class="w-64 h-screen bg-blue-900 text-white fixed">

        <div class="p-6 border-b border-blue-700">

            <h1 class="text-2xl font-bold">
                Pelaporan Barang
            </h1>

        </div>

        <nav class="mt-6">

            <a href="dashboard.html"
            class="flex items-center px-6 py-4 hover:bg-blue-800">

                <span class="material-icons mr-3">
                    dashboard
                </span>

                Dashboard

            </a>

            <a href="add-report.html"
            class="flex items-center px-6 py-4 hover:bg-blue-800">

                <span class="material-icons mr-3">
                    add_circle
                </span>

                Buat Laporan

            </a>

            <a href="my-reports.html"
            class="flex items-center px-6 py-4 bg-blue-800">

                <span class="material-icons mr-3">
                    description
                </span>

                Laporan Saya

            </a>

            <a href="profile.html"
            class="flex items-center px-6 py-4 hover:bg-blue-800">

                <span class="material-icons mr-3">
                    person
                </span>

                Profil

            </a>

        </nav>

    </aside>

    <!-- CONTENT -->

    <main class="ml-64 p-8 w-full">

        <div class="flex justify-between items-center mb-8">

            <div>

                <h2 class="text-4xl font-bold">
                    Laporan Saya
                </h2>

                <p class="text-gray-500">
                    Semua laporan yang pernah Anda buat
                </p>

            </div>

            <a
            href="add-report.html"
            class="bg-blue-800 text-white px-5 py-3 rounded-lg">

                + Buat Laporan

            </a>

        </div>

        <!-- SEARCH -->

        <div class="mb-6">

            <input
            type="text"
            id="searchInput"
            placeholder="Cari laporan..."
            class="w-full border rounded-lg px-4 py-3">

        </div>

        <!-- TABLE -->

        <div class="bg-white rounded-xl shadow overflow-hidden">

            <table class="w-full">

                <thead class="bg-slate-100">

                    <tr>

                        <th class="p-4 text-left">
                            Barang
                        </th>

                        <th class="p-4 text-left">
                            Kategori
                        </th>

                        <th class="p-4 text-left">
                            Tipe
                        </th>

                        <th class="p-4 text-left">
                            Status
                        </th>

                        <th class="p-4 text-left">
                            Aksi
                        </th>

                    </tr>

                </thead>

                <tbody id="reportTable">

                </tbody>

            </table>

        </div>

    </main>

</div>

<script type="module" src="js/my-reports.js"></script>

</body>
</html>

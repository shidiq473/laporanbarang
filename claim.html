<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Klaim Barang</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-slate-100">

<div class="max-w-xl mx-auto mt-10 bg-white p-8 rounded-xl shadow">

    <h1 class="text-3xl font-bold mb-6">
        Klaim Barang
    </h1>

    <form id="claimForm">

        <div class="mb-4">

            <label class="font-semibold">
                Alasan Klaim
            </label>

            <textarea
                id="alasan"
                required
                class="w-full border p-3 rounded mt-2"
            ></textarea>

        </div>

        <div class="mb-6">

            <label class="font-semibold">
                Bukti Kepemilikan
            </label>

            <textarea
                id="bukti"
                required
                class="w-full border p-3 rounded mt-2"
            ></textarea>

        </div>

        <button
            type="submit"
            class="bg-blue-700 text-white px-6 py-3 rounded">

            Kirim Klaim

        </button>

    </form>

</div>

<script type="module" src="js/claim.js"></script>

</body>
</html>

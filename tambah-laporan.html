<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tambah Laporan</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded shadow">

<h1 class="text-2xl font-bold mb-5">
Tambah Laporan
</h1>

<form id="reportForm">

<div class="mb-3">
<label>Nama Barang</label>

<input
id="nama_barang"
type="text"
class="w-full border p-2 rounded"
required>
</div>

<div class="mb-3">
<label>Kategori</label>

<select
id="category"
class="w-full border p-2 rounded"
required>
</select>
</div>

<div class="mb-3">
<label>Deskripsi</label>

<textarea
id="deskripsi"
class="w-full border p-2 rounded">
</textarea>
</div>

<div class="mb-3">
<label>Lokasi</label>

<input
id="lokasi"
type="text"
class="w-full border p-2 rounded"
required>
</div>

<div class="mb-3">
<label>Tanggal Kejadian</label>

<input
id="tanggal"
type="date"
class="w-full border p-2 rounded"
required>
</div>

<div class="mb-3">
<label>Tipe Laporan</label>

<select
id="tipe"
class="w-full border p-2 rounded">

<option value="hilang">
Barang Hilang
</option>

<option value="ditemukan">
Barang Ditemukan
</option>

</select>
</div>

<button
type="submit"
class="bg-blue-600 text-white px-5 py-2 rounded">

Simpan

</button>

</form>

</div>

<script type="module" src="js/tambah-laporan.js"></script>

</body>
</html>

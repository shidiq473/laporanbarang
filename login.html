<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Lost & Found</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100 flex justify-center items-center min-h-screen">

<div class="bg-white w-full max-w-md rounded-xl shadow-lg overflow-hidden">

    <!-- Header -->
    <div class="bg-blue-800 text-white text-center py-8">

        <h1 class="text-4xl font-bold">
            Login
        </h1>

        <p class="mt-2 text-sm">
            Sistem Pelaporan Kehilangan Barang
        </p>

    </div>

    <!-- Form -->
    <div class="p-8">

        <form id="loginForm" class="space-y-5">

            <div>

                <label class="block mb-2 font-semibold">
                    Email atau Username
                </label>

                <input
                    type="text"
                    id="identifier"
                    placeholder="Masukkan Email atau Username"
                    required
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

            </div>

            <div>

                <label class="block mb-2 font-semibold">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Masukkan Password"
                    required
                    class="w-full border rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

            </div>

            <!-- Pesan Error -->
            <div
                id="errorMessage"
                class="hidden bg-red-100 text-red-700 px-4 py-2 rounded-lg text-sm">
            </div>

            <button
                type="submit"
                class="w-full bg-blue-800 text-white py-3 rounded-lg font-bold hover:bg-blue-900 transition"
            >
                Login
            </button>

        </form>

        <p class="text-center mt-6 text-gray-600">

            Belum punya akun?

            <a
                href="register.html"
                class="text-blue-700 font-semibold hover:underline"
            >
                Register
            </a>

        </p>

    </div>

</div>

<script type="module" src="./js/login.js"></script>

</body>
</html>

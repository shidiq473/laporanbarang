<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ganti Password</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-slate-100">

<div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow">

    <h1 class="text-3xl font-bold mb-6">
        Ganti Password
    </h1>

    <form id="passwordForm">

        <div class="mb-4">

            <label class="block mb-2 font-semibold">
                Password Baru
            </label>

            <input
            id="newPassword"
            type="password"
            required
            minlength="6"
            class="w-full border rounded-lg px-4 py-3">

        </div>

        <div class="mb-6">

            <label class="block mb-2 font-semibold">
                Konfirmasi Password
            </label>

            <input
            id="confirmPassword"
            type="password"
            required
            minlength="6"
            class="w-full border rounded-lg px-4 py-3">

        </div>

        <button
        type="submit"
        class="w-full bg-green-600 text-white py-3 rounded-lg">

            Simpan Password

        </button>

    </form>

</div>

<script type="module" src="js/change-password.js"></script>

</body>
</html>
